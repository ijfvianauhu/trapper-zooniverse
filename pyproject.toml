[tool.poetry]
name = "trapper-zooniverse"
version = "0.1.0"
description = "A bridge for integrating Trapper with Zooniverse projects"
authors = ["ijfviana <ijfviana@gmail.com>"]
readme = "README.md"
packages = [{ include = "trapper_zooniverse" }]


[tool.poetry.scripts]
trapper-zooniverse = "trapper_zooniverse.ui.typer.main:app"
#build-docs = "utils.docs:build_docs"
build-docs = "utils.sphinx:build_docs"
extract-pot = "utils.i18n:extract_translations"
update-po = "utils.i18n:init_translation"
compile-mo = "utils.i18n:compile_translations"

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
pytest = "^8.4.2"
typer-config = "^1.4.2"
panoptes-client = "^1.7.1"
python-dotenv = "^1.1.1"
pyyaml = "^6.0.3"
trapper-client = {git = "https://github.com/ijfvianauhu/trapper-client.git"}
pyjson = "^1.4.1"
pydantic = "^2.12.0"

[tool.poetry.group.dev.dependencies]
pdoc = "^15.0.4"
babel = "^2.17.0"
python-gettext = "^5.0"
polib = "^1.2.0"
sphinx = "^8.2.3"
sphinx-autodoc-typehints = "^3.5.2"
recommonmark = "^0.7.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
